version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: frozenfood_postgres
    restart: always
    environment:
      POSTGRES_USER: admin_b2b
      POSTGRES_PASSWORD: password_rahasia
      POSTGRES_DB: frozenfood_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: